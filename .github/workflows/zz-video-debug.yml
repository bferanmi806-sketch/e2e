name: zz-video-debug
on:
  push:
    branches: [oskar/bidi-video-debug]
permissions:
  contents: read
jobs:
  linux:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: ./.github/actions/workspace-install
      - run: pnpm run build
      - run: node packages/web/dist/bin.js install firefox --with-deps
      - name: repeat
        continue-on-error: true
        working-directory: packages/web
        run: |
          mkdir -p "$RUNNER_TEMP/v"
          for i in $(seq 1 25); do ZZ_BIDI_LOG="$RUNNER_TEMP/v/run-$i" npx vitest run --project integration-firefox tests/integration/lifecycle.test.ts 2>&1 | grep -E "Tests |×" | sed "s/^/run $i: /"; done
      - name: keep failing logs only
        if: always()
        run: echo done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: v
          path: ${{ runner.temp }}/v
